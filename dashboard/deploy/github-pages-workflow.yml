# OPTIONAL auto-deploy. To use it: run `gh auth refresh -s workflow` once,
# copy this file to .github/workflows/deploy-dashboard.yml, and set
# GitHub -> Settings -> Pages -> Source to "GitHub Actions".
# Until then, deploy manually with `npm run deploy` (publishes to the gh-pages branch).

name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/deploy-dashboard.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DATA_SOURCE: csv
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
